    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authError = document.getElementById('authError');
    const demoLoginBtn = document.getElementById('demoLoginBtn');
    const switchModeSpan = document.getElementById('switchMode');
    const modalTitle = document.getElementById('modalTitle');
    
    // Вспомогательные функции
    function getFormattedTime(timestamp) {
        return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return hash.toString();
    }
    
    // Firebase операции
    async function addSystemMessage(text) {
        await messagesRef.push({ text, author: '📡 Система', userId: 'system', timestamp: Date.now(), type: 'system' });
    }
    
    async function addChatMessage(text) {
        if (!currentUser) return;
        await messagesRef.push({ text, author: currentUser.name, userId: currentUser.id, timestamp: Date.now(), type: 'user' });
    }
    
    async function addAlertMessage(text, cameraName) {
        if (!currentUser) return;
        await messagesRef.push({ text, author: `🚨 Оповещение от ${currentUser.name}`, userId: currentUser.id, timestamp: Date.now(), type: 'alert', isAlert: true, alertAuthorId: currentUser.id, cameraName });
        if (Notification.permission === 'granted') new Notification('⚠️ Новое оповещение!', { body: `${currentUser.name} сообщает о событии.` });
        if (navigator.vibrate) navigator.vibrate(200);
    }
    
    async function reportAlert(alertId, alertAuthorId, alertAuthorName) {
        if (!currentUser) { openAuthModal('login'); return; }
        if (alertAuthorId === currentUser.id) { alert('Нельзя жаловаться на своё оповещение'); return; }
        const reportRef = reportsRef.child(alertId);
        const snapshot = await reportRef.once('value');
        let reportData = snapshot.val() || { voters: [], count: 0 };
        if (reportData.voters.includes(currentUser.id)) { alert('Вы уже голосовали'); return; }
        reportData.voters.push(currentUser.id);
        reportData.count++;
        await reportRef.set(reportData);
        await addSystemMessage(`📢 Пользователь ${currentUser.name} пожаловался на оповещение от ${alertAuthorName}. (голосов: ${reportData.count}/3)`);
        if (reportData.count >= 3) {
            const banUntil = Date.now() + 24 * 60 * 60 * 1000;
            await bannedUsersRef.child(alertAuthorId).set({ banUntil, reason: '3+ жалоб' });
            await reportRef.remove();
            await messagesRef.child(alertId).remove();
            await addSystemMessage(`🗑️ Ложное оповещение от ${alertAuthorName} удалено, автор заблокирован на 24ч.`);
            if (currentUser.id === alertAuthorId) eventAlertBtn.disabled = true;
        } else alert(`Жалоба принята. Голосов: ${reportData.count}/3 для блокировки.`);
    }
    
    async function isAlertBanned(userId) {
        const snapshot = await bannedUsersRef.child(userId).once('value');
        const data = snapshot.val();
        if (data && data.banUntil > Date.now()) {
            eventAlertBtn.disabled = true;
            return true;
        }
        eventAlertBtn.disabled = false;
        return false;
    }
    
    // Авторизация
    async function registerUser(name, password) {
        const nameLower = name.toLowerCase();
        const snapshot = await usersRef.orderByChild('nameLower').equalTo(nameLower).once('value');
        if (snapshot.exists()) throw new Error('Пользователь уже существует');
        const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        await usersRef.child(userId).set({ name, nameLower, passwordHash: simpleHash(password), createdAt: Date.now() });
        return { id: userId, name };
    }
    
    async function loginUser(name, password) {
        const snapshot = await usersRef.orderByChild('nameLower').equalTo(name.toLowerCase()).once('value');
        if (!snapshot.exists()) throw new Error('Пользователь не найден');
        let userData = null, userId = null;
        snapshot.forEach(child => { userData = child.val(); userId = child.key; });
        if (simpleHash(password) !== userData.passwordHash) throw new Error('Неверный пароль');
        return { id: userId, name: userData.name };
    }
    
    async function demoLogin() {
        const demoName = 'demo';
        const snapshot = await usersRef.orderByChild('nameLower').equalTo('demo').once('value');
        if (!snapshot.exists()) {
            const userId = 'demo_' + Date.now();
            await usersRef.child(userId).set({ name: demoName, nameLower: 'demo', passwordHash: simpleHash('demo123'), createdAt: Date.now() });
            currentUser = { id: userId, name: demoName };
        } else {
            let userId = null;
            snapshot.forEach(child => { userId = child.key; });
            currentUser = { id: userId, name: demoName };
        }
        authModal.style.display = 'none';
        applyAuthState();
        await addSystemMessage(`👋 ${currentUser.name} присоединился к чату!`);
    }
    
    function applyAuthState() {
        if (currentUser) {
            userStatusBadge.innerHTML = `👤 ${currentUser.name}`;
            userStatusBadge.style.background = '#4c6ef5';
            loginPromptBtn.innerHTML = `👤 ${currentUser.name}`;
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.placeholder = "Напишите сообщение...";
            eventAlertBtn.disabled = false;
            isAlertBanned(currentUser.id);
        } else {
            userStatusBadge.innerHTML = `👁️ гость`;
            loginPromptBtn.innerHTML = `🔑 Войти`;
            chatInput.disabled = true;
            sendBtn.disabled = true;
            chatInput.placeholder = "Войдите, чтобы писать...";
            eventAlertBtn.disabled = true;
        }
    }
    
    function openAuthModal(mode = 'login') {
        isAuthMode = mode;
        modalTitle.innerText = mode === 'login' ? '🔐 Вход' : '📝 Регистрация';
        authSubmitBtn.innerText = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
        switchModeSpan.innerHTML = mode === 'login' ? 'Нет аккаунта? <span id="switchToReg">Зарегистрироваться</span>' : 'Уже есть аккаунт? <span id="switchToLogin">Войти</span>';
        if (mode === 'login') document.getElementById('switchToReg').onclick = () => openAuthModal('register');
        else document.getElementById('switchToLogin').onclick = () => openAuthModal('login');
        authName.value = '';
        authPassword.value = '';
        authError.innerText = '';
        authModal.style.display = 'flex';
    }
    
    async function handleAuthSubmit() {
        const name = authName.value.trim();
        const password = authPassword.value.trim();
        if (!name || !password) { authError.innerText = 'Заполните поля'; return; }
        if (name.length < 3) { authError.innerText = 'Имя не менее 3 символов'; return; }
        try {
            if (isAuthMode === 'register') currentUser = await registerUser(name, password);
            else currentUser = await loginUser(name, password);
            authModal.style.display = 'none';
            applyAuthState();
            await addSystemMessage(`👋 ${currentUser.name} присоединился к чату!`);
        } catch (err) { authError.innerText = err.message; }
    }
    
    function logout() {
        if (currentUser) addSystemMessage(`👋 ${currentUser.name} покинул чат`);
        currentUser = null;
        applyAuthState();
    }
    
    // Видео плеер
    function loadCameraStream(url) {
        if (!url || (currentStreamUrl === url && hls)) return;
        currentStreamUrl = url;
        if (hls) { hls.destroy(); hls = null; }
        videoEl.removeAttribute('src');
        videoEl.load();
        playerStatusSpan.innerText = '⏳ Подключение...';
        if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = url;
            videoEl.play().catch(() => playerStatusSpan.innerText = '▶️ Нажмите');
        } else if (Hls && Hls.isSupported()) {
            hls = new Hls({ debug: false });
            hls.loadSource(url);
            hls.attachMedia(videoEl);
            hls.on(Hls.Events.MANIFEST_PARSED, () => { playerStatusSpan.innerText = '🟢 Онлайн'; videoEl.play().catch(() => {}); });
            hls.on(Hls.Events.ERROR, () => { playerStatusSpan.innerText = '⚠️ Ошибка потока'; });
        } else playerStatusSpan.innerText = '❌ HLS не поддерживается';
    }
    
    function initCameras() {
        cameraSelect.innerHTML = '';
        document.getElementById('camCount').innerText = `${cameras.length} камер`;
        cameras.forEach(cam => {
            const opt = document.createElement('option');
            opt.value = cam.url;
            opt.textContent = `${cam.id}. ${cam.name}`;
            cameraSelect.appendChild(opt);
        });
        if (cameras.length) loadCameraStream(cameras[0].url);
        cameraSelect.onchange = () => loadCameraStream(cameraSelect.value);
    }
    
    function switchToCamera(cameraName) {
        const camera = cameras.find(c => c.name === cameraName);
        if (camera) { cameraSelect.value = camera.url; loadCameraStream(camera.url); }
    }
    
    // Чат с Firebase
    function subscribeToMessages() {
        if (messageListener) messagesRef.off('child_added', messageListener);
        messagesContainer.innerHTML = '';
        messageListener = messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added', (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            const div = document.createElement('div');
            let cls = 'message';
            if (currentUser && msg.userId === currentUser.id && msg.type === 'user') cls += ' message-self';
            if (msg.isAlert) cls += ' message-alert';
            if (msg.type === 'system') cls += ' message-system';
            div.className = cls;
            let authorDisplay = escapeHtml(msg.author);
            if (msg.isAlert) authorDisplay = '🚨 ' + authorDisplay;
            let actions = '';
            if (msg.isAlert && msg.type === 'alert') {
                actions = `<div class="alert-actions">
                    <button class="switch-cam-btn" data-camera="${escapeHtml(msg.cameraName || '')}">📺 Перейти</button>
                    <button class="report-btn" data-id="${snapshot.key}" data-author="${msg.alertAuthorId}" data-name="${escapeHtml(msg.author.replace('🚨 Оповещение от ', ''))}">🚫 Пожаловаться</button>
                </div>`;
            }
            div.innerHTML = `<div class="message-author">${authorDisplay}</div><div class="message-text">${escapeHtml(msg.text)}</div><div class="message-time">${getFormattedTime(msg.timestamp)}</div>${actions}`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            div.querySelectorAll('.switch-cam-btn').forEach(btn => btn.onclick = () => switchToCamera(btn.dataset.camera));
            div.querySelectorAll('.report-btn').forEach(btn => btn.onclick = () => reportAlert(btn.dataset.id, btn.dataset.author, btn.dataset.name));
        });
    }
    
    function toggleFullscreen() {
        const req = playerSection.requestFullscreen || playerSection.webkitRequestFullscreen;
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!document.fullscreenElement) req?.call(playerSection);
        else exit?.call(document);
    }
    
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text || !currentUser) return;
        await addChatMessage(text);
        chatInput.value = '';
    }
    
    async function sendAlert() {
        if (!currentUser) { openAuthModal('login'); return; }
        if (await isAlertBanned(currentUser.id)) return;
        const selectedText = cameraSelect.options[cameraSelect.selectedIndex]?.textContent || 'камере';
        await addAlertMessage(`🔴 ВНИМАНИЕ! Пользователь ${currentUser.name} сообщает о событии на ${selectedText}. Проверьте видеопоток!`, selectedText);
    }
    
    // Инициализация
    initCameras();
    subscribeToMessages();
    applyAuthState();
    
    sendBtn.onclick = sendMessage;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter' && currentUser) sendMessage(); else if (e.key === 'Enter' && !currentUser) openAuthModal('login'); };
    eventAlertBtn.onclick = sendAlert;
    fullscreenBtn.onclick = toggleFullscreen;
    loginPromptBtn.onclick = () => openAuthModal('login');
    authSubmitBtn.onclick = handleAuthSubmit;
    demoLoginBtn.onclick = demoLogin;
    
    const logoutBtn = document.createElement('button');
    logoutBtn.innerText = '🚪 Выйти';
    logoutBtn.style.cssText = 'background:#333; border:none; padding:4px 12px; border-radius:20px; margin-left:8px; font-size:11px; cursor:pointer; color:white;';
    logoutBtn.onclick = logout;
    document.querySelector('.chat-header').appendChild(logoutBtn);
    
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
