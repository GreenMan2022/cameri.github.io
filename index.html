    // Вспомогательные функции
    function getFormattedTime(timestamp) {
        const date = timestamp ? new Date(timestamp) : new Date();
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return hash.toString();
    }

    function renderMessages() {

            return;
        }
        messages.forEach(msg => {
            const messageDiv = document.createElement('div');
            let cls = 'message';
            if (currentUser && msg.userId === currentUser.id && msg.type === 'user') cls += ' message-self';
            if (msg.isAlert) cls += ' message-alert';
            if (msg.type === 'system') cls += ' message-system';
            messageDiv.className = cls;
            let authorDisplay = escapeHtml(msg.author);
            if (msg.isAlert) authorDisplay = '🚨 ' + authorDisplay;
            let actionsHtml = '';

    async function reportAlert(alertId, alertAuthorId, alertAuthorName) {
        if (!firebaseReady) { alert('Чат недоступен'); return; }
        if (!currentUser) { openAuthModal('login'); return; }
        if (alertAuthorId === currentUser.id) { alert('Нельзя жаловаться на своё оповещение'); return; }
        try {
            const reportRef = reportsRef.child(alertId);
            const snapshot = await reportRef.once('value');
            let reportData = snapshot.val() || { voters: [], count: 0 };
            if (reportData.voters.includes(currentUser.id)) { alert('Вы уже голосовали'); return; }
            reportData.voters.push(currentUser.id);
            reportData.count++;
            await reportRef.set(reportData);
            await addSystemMessage(`📢 Пользователь ${currentUser.name} пожаловался на оповещение от ${alertAuthorName}. (голосов: ${reportData.count}/3)`);
            if (reportData.count >= 3) {
                const banUntil = Date.now() + 24 * 60 * 60 * 1000;
                await bannedUsersRef.child(alertAuthorId).set({ banUntil, reason: '3+ жалоб' });
                await reportRef.remove();
                await messagesRef.child(alertId).remove();
                await addSystemMessage(`🗑️ Ложное оповещение от ${alertAuthorName} удалено, автор заблокирован на 24ч.`);
                if (currentUser.id === alertAuthorId) eventAlertBtn.disabled = true;
            } else alert(`Жалоба принята. Голосов: ${reportData.count}/3 для блокировки.`);
        } catch(e) { console.warn(e); alert('Ошибка при отправке жалобы'); }
    }
    
    async function isAlertBanned(userId) {
        if (!firebaseReady) return false;
        try {
            const snapshot = await bannedUsersRef.child(userId).once('value');
            const data = snapshot.val();
            if (data && data.banUntil > Date.now()) {
                document.getElementById('spamWarning').innerText = '⚠️ Вы заблокированы за спам на 24 часа';
                eventAlertBtn.disabled = true;
                return true;
            }
        } catch(e) { console.warn(e); }
        document.getElementById('spamWarning').innerText = '';
        eventAlertBtn.disabled = false;
        return false;
    }
    
    // Авторизация
    async function registerUser(name, password) {
        if (!firebaseReady) throw new Error('Чат недоступен');
        const nameLower = name.toLowerCase();
        const snapshot = await usersRef.orderByChild('nameLower').equalTo(nameLower).once('value');
        if (snapshot.exists()) throw new Error('Пользователь уже существует');
        const userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        await usersRef.child(userId).set({ name, nameLower, passwordHash: simpleHash(password), createdAt: Date.now() });
        return { id: userId, name };
    }
    
    async function loginUser(name, password) {
        if (!firebaseReady) throw new Error('Чат недоступен');
        const snapshot = await usersRef.orderByChild('nameLower').equalTo(name.toLowerCase()).once('value');
        if (!snapshot.exists()) throw new Error('Пользователь не найден');
        let userData = null, userId = null;
        snapshot.forEach(child => { userData = child.val(); userId = child.key; });
        if (simpleHash(password) !== userData.passwordHash) throw new Error('Неверный пароль');
        return { id: userId, name: userData.name };
    }

    async function handleAuthSubmit() {
        const name = authName.value.trim();
        const password = authPassword.value.trim();
        
        if (!name || !password) {
            showAuthStatus('❌ Заполните все поля!', 'error');
            if (!name) authName.style.borderColor = '#ef4444';
            if (!password) authPassword.style.borderColor = '#ef4444';
            setTimeout(() => {
                authName.style.borderColor = '#3a3a55';
                authPassword.style.borderColor = '#3a3a55';
            }, 2000);
            return;
        }
        if (name.length < 3) {
            showAuthStatus('❌ Имя должно быть не менее 3 символов!', 'error');
            authName.style.borderColor = '#ef4444';
            setTimeout(() => authName.style.borderColor = '#3a3a55', 2000);
            return;
        }
        if (password.length < 3) {
            showAuthStatus('❌ Пароль должен быть не менее 3 символов!', 'error');
            authPassword.style.borderColor = '#ef4444';
            setTimeout(() => authPassword.style.borderColor = '#3a3a55', 2000);
            return;
        }
        
        showAuthStatus('⏳ Проверка данных...', 'info');
        authSubmitBtn.disabled = true;
        authSubmitBtn.innerText = isAuthMode === 'login' ? '⏳ Вход...' : '⏳ Регистрация...';
        
        try {
            if (isAuthMode === 'register') {
                currentUser = await registerUser(name, password);
                showAuthStatus('✅ Регистрация успешна!', 'success');
                await addSystemMessage(`👋 ${currentUser.name} присоединился к чату!`);
            } else {
                currentUser = await loginUser(name, password);
                showAuthStatus('✅ Вход выполнен успешно!', 'success');
                await addSystemMessage(`👋 ${currentUser.name} вернулся в чат!`);

            setTimeout(() => {
                authModal.style.display = 'none';
                applyAuthState();
            }, 1000);
        } catch (err) {
            showAuthStatus(`❌ ${err.message}`, 'error');
            if (authModalError) authModalError.innerText = err.message;
        } finally {
            authSubmitBtn.disabled = false;
            authSubmitBtn.innerText = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
        }
    }

    // Видео плеер
    function loadCameraStream(url) {
        if (!url || (currentStreamUrl === url && hls)) return;
        currentStreamUrl = url;
        if (hls) { hls.destroy(); hls = null; }
        videoEl.removeAttribute('src');
        videoEl.load();
        playerStatusSpan.innerText = '⏳ Подключение...';
        if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
            videoEl.src = url;
            videoEl.play().catch(() => playerStatusSpan.innerText = '▶️ Нажмите для запуска');
        } else if (Hls && Hls.isSupported()) {
            hls = new Hls({ debug: false, enableWorker: true });
            hls.loadSource(url);
            hls.attachMedia(videoEl);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                playerStatusSpan.innerText = '🟢 Онлайн';
                videoEl.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, () => { playerStatusSpan.innerText = '⚠️ Ошибка потока'; });
        } else {
            playerStatusSpan.innerText = '❌ HLS не поддерживается';
        }
        videoEl.addEventListener('playing', () => { if(!playerStatusSpan.innerText.includes('Ошибка')) playerStatusSpan.innerText = '🎥 Прямой эфир'; });
    }
    
    function initCameras() {
        cameraSelect.innerHTML = '';
        document.getElementById('camCount').innerText = `${cameras.length} камер`;
        cameras.forEach(cam => {
            const opt = document.createElement('option');
            opt.value = cam.url;
            opt.textContent = `${cam.id}. ${cam.name}`;
            cameraSelect.appendChild(opt);
        });
        if (cameras.length) loadCameraStream(cameras[0].url);
        cameraSelect.addEventListener('change', () => loadCameraStream(cameraSelect.value));
    }

    function switchToCameraByName(cameraName) {
        console.log('Переход на камеру:', cameraName);
        
        // Очищаем название от эмодзи и лишних символов для поиска
        let searchName = cameraName;
        // Удаляем эмодзи камеры (📹) если есть
        searchName = searchName.replace(/^[📹🌆🏙️🚨⚠️🔴]\s*/, '');
        // Удаляем номер с точкой в начале (например "1. ")
        searchName = searchName.replace(/^\d+\.\s*/, '');
        
        console.log('Поиск по имени:', searchName);
        
        // Ищем камеру (по частичному совпадению, т.к. названия могут отличаться)
        let camera = cameras.find(c => {
            // Точное совпадение
            if (c.name === cameraName) return true;
            // Совпадение после удаления номера
            const cleanCamName = c.name.replace(/^\d+\.\s*/, '');
            if (cleanCamName === searchName) return true;
            // Частичное совпадение (содержит)
            if (cleanCamName.includes(searchName) || searchName.includes(cleanCamName)) return true;
            return false;
        });
        
        // Если не нашли, пробуем поискать по первому вхождению в названии
        if (!camera) {
            camera = cameras.find(c => c.name.toLowerCase().includes(searchName.toLowerCase()));
        }
        
        if (camera) {
            console.log('Найдена камера:', camera.name);
            cameraSelect.value = camera.url;
            loadCameraStream(camera.url);
            // Показываем уведомление о переключении
            if (currentUser) {
                addSystemMessage(`📡 ${currentUser.name} переключился на камеру: ${camera.name}`);
            }
            // Прокручиваем к списку камер (опционально)
            cameraSelect.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            console.warn('Камера не найдена:', cameraName);
            // Пробуем найти среди всех названий
            const allNames = cameras.map(c => c.name).join(', ');
            console.log('Доступные камеры:', allNames);
            alert(`Камера "${cameraName}" не найдена. Попробуйте выбрать вручную из списка.`);
        }
    }

    function subscribeToMessages() {
        if (!firebaseReady) {
            messagesContainer.innerHTML = '<div class="message message-system"><div class="message-author">⚠️ Ошибка</div><div class="message-text">Чат недоступен. Проверьте подключение к интернету.</div></div>';
            return;
        }
        if (messageListener) messagesRef.off('child_added', messageListener);
        messages = [];
        messageListener = messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added', (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            msg.id = snapshot.key;
            messages.push(msg);
            messages.sort((a, b) => a.timestamp - b.timestamp);
            renderMessages();
        });
    }
    
    function toggleFullscreen() {
        const elem = playerSection;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const requestMethod = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
            if (requestMethod) requestMethod.call(elem).catch(err => console.warn('Fullscreen error:', err));
        } else {
            const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (exitMethod) exitMethod.call(document);
        }
    }
    
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text || !currentUser) return;
        await addChatMessage(text);
        chatInput.value = '';
    }
    
    async function sendAlert() {
        if (!currentUser) { openAuthModal('login'); return; }
        if (!firebaseReady) { alert('Чат недоступен'); return; }
        if (await isAlertBanned(currentUser.id)) return;
        const selectedText = cameraSelect.options[cameraSelect.selectedIndex]?.textContent || 'камере';
        await addAlertMessage(`🔴 ВНИМАНИЕ! Пользователь ${currentUser.name} сообщает о событии на ${selectedText}. Проверьте видеопоток!`, selectedText);
    }
    
    // PWA Установка
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'block';
        console.log('PWA installation prompt ready');
    });
    
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.style.display = 'none';
                deferredPrompt = null;
            }
        });
    }
    
    // Регистрация Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered:', reg))
                .catch(err => console.log('SW registration failed:', err));
        });
    }
    
    // Запрос уведомлений
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    
    // Инициализация
    function init() {
        initCameras();
        subscribeToMessages();
        applyAuthState();
        
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentUser) sendMessage();
            else if (e.key === 'Enter' && !currentUser) openAuthModal('login');
        });
        eventAlertBtn.addEventListener('click', sendAlert);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        loginPromptBtn.addEventListener('click', () => openAuthModal('login'));
        authSubmitBtn.addEventListener('click', handleAuthSubmit);
        demoLoginBtn.addEventListener('click', demoLogin);
        
        if (closeAuthBtn) closeAuthBtn.addEventListener('click', closeAuthModal);
        if (authModal) authModal.addEventListener('click', (e) => { if (e.target === authModal) closeAuthModal(); });
    }
    
    init();
</script>
</body>
</html>
